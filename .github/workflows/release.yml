name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish_command: ${{ steps.visibility.outputs.publish_command }}
    steps:
      - name: Check repository visibility
        id: visibility
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            // Dependabot merges never carry changesets, so there is nothing to
            // publish — skip the publish step and let the action only maintain
            // the release PR. (Squash merges keep dependabot as commit author.)
            const headAuthor = context.payload.head_commit?.author?.username ?? ""
            const isDependabot = headAuthor === "dependabot[bot]"

            const publishCommand = repo.private || isDependabot ? "" : "pnpm changeset:publish"
            core.setOutput("publish_command", publishCommand)

            if (repo.private) {
              core.notice("Repository is private. Skip npm publish and allow Changesets to prepare or update the release PR only.")
            }

            if (isDependabot) {
              core.notice("Dependabot merge. Skip npm publish and allow Changesets to prepare or update the release PR only.")
            }

  release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # Pinned to the npm 11 major: trusted publishing needs >= 11.5.1, and the
      # registry CLI in the publish path should only change majors deliberately
      # (npm 12's `npm info --json` array output broke changesets 2.31.0).
      - name: Ensure npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: OIDC preflight
        if: needs.preflight.outputs.publish_command != ''
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "id-token permission is not granted; OIDC publish will fail."
            exit 1
          fi
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version: pnpm changeset:version
          publish: ${{ needs.preflight.outputs.publish_command }}
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
